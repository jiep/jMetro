name: CI

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      
    steps:
    - name: Install Maven
      run: sudo mkdir -p /usr/share/man/man1/ && sudo apt update && sudo apt install -y maven python3

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 8
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'zulu'
        java-version: '8'
    - name: Build with Maven
      run: mvn clean compile resources:resources assembly:single

    - name: Move jar to root
      if: startsWith(github.ref, 'refs/tags/v')
      run: mv target/jMetro-*-jar-with-dependencies.jar .

    - name: Set release
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        chmod +x ./.github/extract_version
        VERSION=`./.github/extract_version`
        TAG_VERSION="${GITHUB_REF_NAME#v}"

        if [ "$VERSION" != "$TAG_VERSION" ]; then
          echo "Tag version ($TAG_VERSION) does not match artifact version ($VERSION)."
          exit 1
        fi

        gh release create "${GITHUB_REF_NAME}" ./*.jar \
          --verify-tag \
          --title "${GITHUB_REF_NAME}" \
          --generate-notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate attestation
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "jMetro-*.jar"
